name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Formspree endpoint
        id: formspree
        env:
          FROM_SECRET: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          FROM_VAR: ${{ vars.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
        run: |
          ENDPOINT="${FROM_SECRET:-$FROM_VAR}"
          if [ -z "$ENDPOINT" ]; then
            echo "::warning::NEXT_PUBLIC_FORMSPREE_ENDPOINT is not set as an Actions secret or variable. Contact form will use mailto fallback."
          else
            echo "Formspree endpoint is configured for this build."
          fi
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ steps.formspree.outputs.endpoint }}

      # Publish the static export to the gh-pages branch.
      # GitHub Pages must use: Settings → Pages → Deploy from a branch → gh-pages / (root)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
          cname: growstack.tech
